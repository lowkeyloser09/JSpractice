        function removeEgg(foods) {
            return foods.filter(food => food !== "egg");
        }
        console.log(removeEgg(["apple", "egg", "banana", "egg", "egg"]));
        
        function removeTwoEggs(foods) {
            let eggsRemoved = 0;
            return foods.filter((food) => {
                if (food === "egg" && eggsRemoved < 2) {
                    eggsRemoved++;
                    return false;
                } else {
                    return true;
                }
            })
        }

        console.log(removeTwoEggs(["apple", "egg", "banana", "egg", "egg"]));
