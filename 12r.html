<!DOCTYPE html>
<html>
  <head>
    <title>12r</title>
    <link rel="stylesheet" href="./styles/12r.css">
  </head>
  <body>
    <p class="title">Rock Paper Scissors</p>

    <button class="move-button js-rock-button"><img src="./images/rock-emoji.png" class="move-icon"></button>

    <button class="move-button js-paper-button"><img src="./images/paper-emoji.png" class="move-icon"></button>

    <button class="move-button js-scissors-button"><img src="./images/scissors-emoji.png" class="move-icon"></button>

    <p class="show result"></p>

    <p class="moves">
      You <img src="./images/rock-emoji.png" class="move-icon">
      <img src="images/scissors-emoji.png" class="move-icon">
      Computer
    </p>

    <p class="score"></p>

    <button class="reset">Resest Score</button>
    <button class="auto-play">Auto Play</button>
  
    <script src="./scripts/12r.js"></script>
  </body>
</html>
